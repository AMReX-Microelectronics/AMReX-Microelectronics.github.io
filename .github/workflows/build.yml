name: Build Documentation

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-ci-workflow
  cancel-in-progress: true

permissions:
  contents: read  # Required to read repository contents
  pages: write    # Required to deploy to GitHub Pages
  id-token: write # Required to request an ID token for deployment    

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r Docs/requirements.txt

      - name: Build documentation
        run: |
          cd Docs
          make clean
          make html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        uses: JamesIves/github-pages-deploy-action@v4.5.0          
        with:
          repository-name: AMReX-Microelectronics/AMReX-Microelectronics.github.io
          branch: gh-pages
          folder: Docs/build/html
          clean: false
        env:        
          github_token: ${{ secrets.GITHUB_TOKEN }}

        #current error: remote: Permission to AMReX-Microelectronics/AMReX-Microelectronics.github.io.git denied to github-actions[bot].
